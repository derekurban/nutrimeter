# Opened from the app (Targets > Feedback, mobile/lib/logic/update.dart reportUrl) with the version and phone filled
# in. URLs can fill text fields only (not dropdowns), so the fields the app fills stay inputs; mobile/test/update_test.dart
# checks they are.
name: Report a problem
description: Something broke, looks wrong, or got in the way.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Reports here are public, so leave out anything personal (your diary, weight, targets).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw. A screenshot helps; drag it into this box.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The screens and taps that lead to it, if you know them. For a food, its name or barcode.
      placeholder: |
        1. Open Diary
        2. Scan 0064200116473
        3. ...
  - type: input
    id: often
    attributes:
      label: How often
      placeholder: Every time, sometimes, or once so far
  - type: input
    id: version
    attributes:
      label: App version
      description: Filled in when you report from the app. Otherwise, Targets > Updates shows it.
  - type: input
    id: device
    attributes:
      label: Phone
      description: Model and Android version.
